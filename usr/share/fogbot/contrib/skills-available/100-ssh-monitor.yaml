id: 100
name: ssh-monitor
description: >
  Monitors the systemd journal's auth messages (what auth.log receives)
  for SSH authentication events.
  Detects brute force attempts, successful logins from new IPs,
  direct root logins, and failed sudo/su attempts.
why: >
  SSH is the most common remote access vector on Linux systems.
  Repeated failed logins mean someone is guessing passwords, and
  a successful login from an IP that has never connected before —
  especially at an unusual hour — is a high-value indicator of
  compromise. Direct root login bypasses the sudo audit trail
  entirely.
requires:
  - systemd journal read access
tags: [auth, ssh, brute-force]
severity_default: yellow
config:
  brute_force_threshold: 5
  brute_force_window: 60s
  alert_new_ip_login: true
  quiet_hours_exempt: false
  # journal: only believe a message when the journal shows sshd (as root),
  # sudo or su really sent it. file: read auth_log_path instead, whose lines
  # any local user can fake with logger(1).
  log_source: journal
  # auth_log_path: /var/log/auth.log
