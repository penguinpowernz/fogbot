id: 510
name: port-tripwires
description: >
  Configures iptables LOG rules for ports commonly used by malware and C2
  frameworks. Monitors both inbound and outbound traffic.
why: >
  Outbound connections to unusual ports are often the first observable
  indicator of compromise. Malware phones home, lateral movement tools
  connect to SMB, crypto miners connect to Stratum pools.
requires:
  - iptables
  - root
tags: [network, ports, c2, malware]
severity_default: red
requires_approval: true
config:
  watch_inbound: [135, 139, 445, 4444, 31337, 12345]
  watch_outbound: [4444, 1080, 25, 3333, 5555, 7777, 14444]
  # The rules log each new TCP connection (its SYN) to the kernel log, rate
  # limited, and outbound hits name the user whose process connected. They
  # live in the iptables raw table, ahead of the filter table that ufw (or any
  # other firewall manager) owns, so they see traffic ufw drops or allows and
  # never change its verdicts or the order of its rules. A
  # retrying client sends several SYNs, so after alerting a tripwire stays
  # quiet this long for the same remote address and port. Every hit, inbound
  # or outbound, is CONTACT.
  alert_cooldown: 5m
