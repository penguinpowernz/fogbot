id: 715
name: net-discover
description: >
  Passively learns the hosts on the local network from the kernel's
  neighbour table and from ARP and DHCP broadcasts, keeps a baseline of
  their MAC addresses per network, and alerts when a new one appears.
  Sends no traffic of its own.
why: >
  A device joining your network that you didn't add could be a rogue
  access point, a drop box someone plugged in, or a neighbour on your
  Wi-Fi. Listening rather than sweeping keeps fogbot invisible on the
  network: it watches and reports, it doesn't probe. The Intel button
  offers active reconnaissance (nmap, arp-scan) on a new host, only when
  the operator taps it.
requires:
  - root
tags: [network, discovery, baseline]
severity_default: red
intel_module: net-scan
config:
  # Empty means the interface holding the default route
  interfaces: []
  # How often to read the kernel neighbour table
  poll_interval: 1m
  # Also read ARP and DHCP broadcasts off the wire (raw socket, not
  # promiscuous), to see hosts that never talk to this one
  listen_broadcasts: true
  exclude_macs: []
  include_mac_vendor: true
  include_reverse_dns: true
