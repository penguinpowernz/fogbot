id: 520
name: cron-watch
description: >
  Uses inotify to monitor cron and at: /etc/crontab, the /etc/cron.*
  directories and the user crontab and at job spools. Alerts on new or
  modified scheduled tasks.
why: >
  Persistence via scheduled tasks is a standard post-exploitation
  technique. Attackers add cron or at jobs to maintain access and run
  periodic tasks.
requires:
  - inotify
tags: [persistence, cron, at]
severity_default: red
config:
  watch_paths:
    - /etc/crontab
    - /etc/cron.d
    - /etc/cron.daily
    - /etc/cron.hourly
    - /etc/cron.monthly
    - /etc/cron.weekly
    - /var/spool/cron/crontabs
    - /var/spool/cron/atjobs
