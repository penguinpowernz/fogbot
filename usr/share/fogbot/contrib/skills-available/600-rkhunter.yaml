id: 600
name: rkhunter
description: >
  Reads rkhunter's log after each scan and alerts on warnings not in the
  previous scan and on every rootkit found. Alerts if rkhunter stops
  scanning.
why: >
  rkhunter checks system binaries against known-good hashes and looks for
  known rootkits. Its findings are only useful if someone reads them.
requires:
  - rkhunter
tags: [rootkit, scanner]
severity_default: red
config:
  log_path: /var/log/rkhunter.log
  alert_on_warning: true
  alert_on_infection: true
  # Alert on every warning in every scan, not just new ones
  repeat_warnings: false
  # Alert if no scan finishes for this long ("off" to never)
  max_scan_age: 48h
